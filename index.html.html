<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجرة الأبطال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080d1c; --bg-2:#0e1630;
    --panel: rgba(255,255,255,0.045); --panel-hover: rgba(255,255,255,0.07); --panel-border: rgba(255,255,255,0.09);
    --text:#eef2ff; --text-muted:#8b96c4;
    --gold:#ffc53d; --gold-2:#ffe08a; --gold-glow: rgba(255,197,61,.55);
    --danger:#ff6b6b; --danger-glow: rgba(255,107,107,.45); --success:#34d399;
    --radius-lg:22px; --radius-md:14px; --radius-sm:10px;
    --font-display:'Baloo Bhaijan 2', system-ui, sans-serif; --font-body:'Tajawal', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 15% -10%, #1a2452 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, #2a1a4a 0%, transparent 55%), var(--bg);
    color:var(--text); font-family:var(--font-body); min-height:100vh; overflow-x:hidden;
  }
  .stars-bg{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .twinkle{ position:absolute; border-radius:50%; background:#fff; animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.15; transform:scale(1);} 50%{opacity:.9; transform:scale(1.4);} }
  .app{ position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:20px 22px 60px; }

  /* ---- Password gate ---- */
  .pass-gate{ display:none; flex-direction:column; align-items:center; justify-content:center; min-height:82vh; text-align:center; gap:18px; }
  .pass-gate .brand-icon{ font-size:42px; color:var(--gold); text-shadow:0 0 22px var(--gold-glow); animation: spinStar 6s linear infinite; }
  .pass-gate h1{ font-family:var(--font-display); font-size:30px; margin:4px 0 0; }
  .pass-gate .sub{ color:var(--text-muted); margin:0 0 8px; font-size:14px; }
  .pass-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius-lg); padding:28px 26px; width:100%; max-width:360px; }
  .pass-card .input{ margin-bottom:14px; text-align:center; letter-spacing:3px; font-size:18px; }
  .pass-err{ color:var(--danger); font-size:13px; margin:8px 0 0; min-height:18px; }

  /* ---- Role gate ---- */
  .role-gate{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:82vh; text-align:center; gap:26px; }
  .role-gate .brand-icon{ font-size:38px; color:var(--gold); text-shadow:0 0 22px var(--gold-glow); animation: spinStar 6s linear infinite; }
  .role-gate h1{ font-family:var(--font-display); font-size:32px; margin:6px 0 0; }
  .role-gate .sub{ color:var(--text-muted); margin:0; }
  .role-options{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  .role-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius-lg); padding:28px 30px; cursor:pointer; width:230px; transition:.2s; font-family:var(--font-body); color:var(--text); }
  .role-card:hover{ background:var(--panel-hover); transform:translateY(-5px); border-color:var(--gold); }
  .role-card .icon{ font-size:40px; margin-bottom:10px; }
  .role-card h3{ font-family:var(--font-display); margin:6px 0 4px; font-size:18px; }
  .role-card p{ color:var(--text-muted); font-size:12.5px; margin:0; line-height:1.5; }

  /* ---- Join view ---- */
  .join-wrap{ max-width:480px; margin:8vh auto; text-align:center; }
  .join-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius-lg); padding:32px 26px; }
  .join-card h2{ font-family:var(--font-display); margin:0 0 6px; font-size:22px; }
  .join-card p.sub{ color:var(--text-muted); font-size:13.5px; margin:0 0 20px; }
  .quiz-progress{ color:var(--text-muted); font-size:13px; margin-bottom:12px; }
  .quiz-q{ text-align:right; font-size:14.5px; font-weight:700; line-height:1.55; margin:0 0 14px; }
  .quiz-options{ display:flex; flex-direction:column; gap:8px; text-align:right; }
  .quiz-opt{ background:rgba(255,255,255,.04); border:1px solid var(--panel-border); border-radius:var(--radius-md); padding:12px 14px; cursor:pointer; font-family:var(--font-body); color:var(--text); font-size:13.5px; transition:.15s; line-height:1.45; }
  .quiz-opt:hover{ border-color:var(--gold); background:rgba(255,197,61,.08); }
  .quiz-opt.selected{ border-color:var(--gold); background:rgba(255,197,61,.15); }
  .quiz-opt.correct{ border-color:var(--success); background:rgba(52,211,153,.15); color:var(--success); }
  .quiz-opt.wrong{ border-color:var(--danger); background:rgba(255,107,107,.12); color:var(--danger); }
  .quiz-opt:disabled{ cursor:default; }
  .back-link{ background:none; border:none; color:var(--text-muted); font-family:var(--font-body); font-size:13px; cursor:pointer; margin-bottom:18px; }
  .back-link:hover{ color:var(--text); }
  .join-msg{ font-size:14px; padding:12px; border-radius:var(--radius-sm); margin-top:14px; }
  .join-msg.warn{ background:rgba(255,107,107,.1); color:var(--danger); border:1px solid rgba(255,107,107,.3); }
  .team-badge-big{ display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:999px; font-family:var(--font-display); font-size:18px; margin:16px 0; }
  .team-badge-big .dot{ width:10px; height:10px; border-radius:50%; background:#fff; }

  /* ---- Topbar ---- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:14px 6px 22px; border-bottom:1px solid var(--panel-border); margin-bottom:22px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-icon{ font-size:30px; color:var(--gold); text-shadow:0 0 18px var(--gold-glow); animation: spinStar 6s linear infinite; display:inline-block; }
  @keyframes spinStar{ from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .brand h1{ font-family:var(--font-display); font-size:26px; margin:0; letter-spacing:.3px; }
  .brand-sub{ margin:2px 0 0; color:var(--text-muted); font-size:13px; }
  .tabs{ display:flex; gap:8px; background:var(--panel); border:1px solid var(--panel-border); padding:5px; border-radius:999px; flex-wrap:wrap; }
  .tab{ font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--text-muted); background:transparent; border:none; padding:9px 18px; border-radius:999px; cursor:pointer; transition:.2s; }
  .tab:hover{ color:var(--text); }
  .tab.active{ background:linear-gradient(135deg,var(--gold),#ffa63d); color:#241400; box-shadow:0 4px 16px var(--gold-glow); }
  .tab:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .view{ display:none; animation: fadeUp .35s ease; }
  .view.active{ display:block; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .hint-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius-md); padding:12px 16px; margin-bottom:20px; color:var(--text-muted); font-size:13.5px; }
  .hint-bar .actions{ display:flex; gap:8px; flex:none; }

  .empty-state{ text-align:center; padding:70px 20px; border:2px dashed var(--panel-border); border-radius:var(--radius-lg); }
  .empty-state .icon{ font-size:44px; margin-bottom:10px; }
  .empty-state h3{ font-family:var(--font-display); margin:0 0 6px; font-size:22px; }
  .empty-state p{ color:var(--text-muted); margin:0 0 18px; }

  .btn{ font-family:var(--font-body); font-weight:700; border:none; border-radius:999px; padding:11px 22px; cursor:pointer; font-size:14px; transition:.15s; display:inline-flex; align-items:center; gap:6px; }
  .btn:active{ transform:scale(.96); }
  .btn.small{ padding:8px 14px; font-size:13px; }
  .btn-gold{ background:linear-gradient(135deg,var(--gold),#ffa63d); color:#241400; box-shadow:0 4px 14px var(--gold-glow); }
  .btn-gold:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:var(--panel); color:var(--text); border:1px solid var(--panel-border); }
  .btn-ghost:hover{ background:var(--panel-hover); }
  .btn-danger-outline{ background:transparent; color:var(--danger); border:1px solid rgba(255,107,107,.4); }
  .btn-danger-outline:hover{ background:rgba(255,107,107,.1); }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }

  /* ---- Teams grid ---- */
  .teams-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
  .team-card{ --tc:#8b5cf6; position:relative; background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius-lg); padding:14px; overflow:hidden; transition:box-shadow .3s; border-top:3px solid var(--tc); }
  .team-card.leading{ box-shadow:0 0 0 1px var(--tc), 0 10px 40px -10px var(--tc); animation:leadPulse 2.6s ease-in-out infinite; }
  @keyframes leadPulse{ 0%,100%{ box-shadow:0 0 0 1px var(--tc), 0 8px 26px -12px var(--tc);} 50%{ box-shadow:0 0 0 1px var(--tc), 0 14px 46px -10px var(--tc);} }
  .team-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .team-name-wrap{ display:flex; align-items:center; gap:8px; min-width:0; }
  .team-swatch{ width:12px; height:12px; border-radius:50%; background:var(--tc); box-shadow:0 0 10px var(--tc); flex:none; }
  .team-head h3{ font-family:var(--font-display); font-size:17px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .crown{ font-size:16px; margin-inline-start:4px; filter:drop-shadow(0 0 6px var(--gold-glow)); }
  .team-score{ font-family:var(--font-display); font-size:18px; color:var(--tc); white-space:nowrap; }
  .team-score small{ font-family:var(--font-body); font-size:11px; color:var(--text-muted); font-weight:500; }
  .team-actions{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--panel-border); }
  .team-actions .mini-btn{ flex:1; min-width:0; justify-content:center; }
  .students{ display:flex; flex-direction:column; gap:6px; }
  .empty-hint{ color:var(--text-muted); font-size:13px; text-align:center; padding:14px 0; }

  .student-row{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.03); border:1px solid transparent; border-radius:var(--radius-md); padding:8px 10px; position:relative; cursor:pointer; transition:.15s; }
  .student-row:hover{ background:rgba(255,255,255,.06); }
  .student-row.selected{ border-color:var(--tc, var(--gold)); background:color-mix(in srgb, var(--tc, #ffc53d) 18%, transparent); box-shadow:0 0 0 1px var(--tc, var(--gold)); }
  .student-row.shake{ animation:shake .5s ease; border-color:rgba(255,107,107,.5); }
  @keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
  .avatar{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:13px; flex:none; }
  .student-info{ flex:1; min-width:0; }
  .student-name{ font-size:13.5px; font-weight:700; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .star-count{ font-family:var(--font-display); font-size:14px; color:var(--gold); white-space:nowrap; flex:none; min-width:42px; text-align:left; }
  .star-count.pop{ animation:starPop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes starPop{ 0%{ transform:scale(0.6); opacity:0.4; } 60%{ transform:scale(1.25); } 100%{ transform:scale(1); opacity:1; } }
  .mini-btn{ border:none; border-radius:999px; font-family:var(--font-body); font-weight:700; font-size:12px; padding:7px 10px; cursor:pointer; transition:.15s; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  .mini-btn:active{ transform:scale(.92); }
  .btn-correct{ background:rgba(52,211,153,.15); color:var(--success); border:1px solid rgba(52,211,153,.35); }
  .btn-correct:hover{ background:rgba(52,211,153,.28); }
  .btn-wrong{ background:rgba(255,107,107,.12); color:var(--danger); border:1px solid rgba(255,107,107,.3); }
  .btn-wrong:hover{ background:rgba(255,107,107,.24); }
  .btn-participate{ background:rgba(255,197,61,.12); color:var(--gold); border:1px solid rgba(255,197,61,.35); }
  .btn-participate:hover{ background:rgba(255,197,61,.25); }
  .btn-homework{ background:rgba(56,189,248,.12); color:#38bdf8; border:1px solid rgba(56,189,248,.35); }
  .btn-homework:hover{ background:rgba(56,189,248,.25); }
  .btn-punish{ background:rgba(251,113,133,.12); color:#fb7185; border:1px solid rgba(251,113,133,.35); }
  .btn-punish:hover{ background:rgba(251,113,133,.25); }

  /* ---- Celebration ---- */
  .celeb-overlay{ position:fixed; inset:0; background:rgba(4,6,16,.82); backdrop-filter:blur(4px); z-index:120; display:none; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
  .celeb-overlay.open{ display:flex; }
  .celeb-box{ background:linear-gradient(160deg,#1a1030 0%,#141a34 50%,#0e1630 100%); border:1px solid rgba(255,197,61,.35); border-radius:24px; padding:28px 22px 24px; max-width:420px; width:100%; text-align:center; position:relative; overflow:hidden; animation:fadeUp .4s ease; box-shadow:0 0 60px rgba(255,197,61,.15); }
  .celeb-box h2{ font-family:var(--font-display); font-size:24px; margin:0 0 6px; color:var(--gold); text-shadow:0 0 20px var(--gold-glow); }
  .celeb-box .celeb-sub{ color:var(--text-muted); font-size:13.5px; margin:0 0 22px; }
  .celeb-podium{ display:flex; align-items:flex-end; justify-content:center; gap:10px; margin-bottom:20px; min-height:180px; }
  .celeb-place{ flex:1; max-width:120px; display:flex; flex-direction:column; align-items:center; }
  .celeb-place .medal{ font-size:28px; margin-bottom:6px; animation:starPop .6s cubic-bezier(.34,1.56,.64,1) both; }
  .celeb-place.p1 .medal{ font-size:36px; animation-delay:.15s; }
  .celeb-place.p2 .medal{ animation-delay:.05s; }
  .celeb-place.p3 .medal{ animation-delay:.25s; }
  .celeb-avatar{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:18px; margin-bottom:8px; border:2px solid rgba(255,255,255,.15); }
  .celeb-place.p1 .celeb-avatar{ width:64px; height:64px; font-size:22px; border-color:var(--gold); box-shadow:0 0 20px var(--gold-glow); }
  .celeb-name{ font-weight:700; font-size:13px; margin-bottom:2px; word-break:break-word; }
  .celeb-place.p1 .celeb-name{ font-size:15px; color:var(--gold); }
  .celeb-stars{ font-family:var(--font-display); color:var(--gold); font-size:13px; }
  .celeb-bar{ width:100%; border-radius:12px 12px 0 0; margin-top:8px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; font-family:var(--font-display); font-size:18px; color:rgba(255,255,255,.7); }
  .celeb-place.p1 .celeb-bar{ height:90px; background:linear-gradient(180deg,rgba(255,197,61,.35),rgba(255,197,61,.12)); }
  .celeb-place.p2 .celeb-bar{ height:65px; background:linear-gradient(180deg,rgba(192,192,192,.3),rgba(192,192,192,.1)); }
  .celeb-place.p3 .celeb-bar{ height:45px; background:linear-gradient(180deg,rgba(205,127,50,.3),rgba(205,127,50,.1)); }
  .celeb-confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .celeb-confetti span{ position:absolute; top:-10px; width:8px; height:8px; border-radius:2px; animation:confettiFall 3s ease-in forwards; }
  @keyframes confettiFall{ 0%{ transform:translateY(0) rotate(0); opacity:1; } 100%{ transform:translateY(420px) rotate(720deg); opacity:0; } }
  .celeb-empty{ color:var(--text-muted); padding:40px 10px; }

  .particle{ position:absolute; top:6px; left:6px; width:6px; height:6px; border-radius:50%; pointer-events:none; animation:particleFly .7s ease-out forwards; }
  @keyframes particleFly{ to{ transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; } }

  #toast-container{ position:fixed; top:18px; left:18px; z-index:50; display:flex; flex-direction:column; gap:10px; max-width:320px; }
  .toast{ background:#1a1030; border:1px solid rgba(255,197,61,.4); border-inline-start:4px solid var(--gold); border-radius:var(--radius-md); padding:12px 14px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.4); animation:toastIn .3s ease; }
  .toast b{ display:block; margin-bottom:2px; font-family:var(--font-display); font-size:13px; color:var(--gold); }
  @keyframes toastIn{ from{ transform:translateX(-30px); opacity:0; } to{ transform:translateX(0); opacity:1; } }
  .toast.leaving{ animation:toastOut .25s ease forwards; }
  @keyframes toastOut{ to{ opacity:0; transform:translateX(-20px); } }

  .lb-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start; }
  @media (max-width:820px){ .lb-grid{ grid-template-columns:1fr; } }
  .panel-block{ background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius-lg); padding:18px; margin-bottom:18px; }
  .panel-block h2{ font-family:var(--font-display); font-size:19px; margin:0 0 14px; }
  .muted-text{ color:var(--text-muted); font-size:12.5px; line-height:1.6; margin:0 0 12px; }
  .warn-text{ color:var(--danger); font-size:12.5px; line-height:1.6; margin:8px 0 0; }
  .rank-row{ display:flex; align-items:center; gap:12px; padding:10px 8px; border-radius:var(--radius-sm); }
  .rank-row + .rank-row{ border-top:1px solid var(--panel-border); }
  .rank-num{ font-family:var(--font-display); width:26px; text-align:center; color:var(--text-muted); font-size:15px; }
  .rank-row.top1 .rank-num, .rank-row.top2 .rank-num, .rank-row.top3 .rank-num{ font-size:19px; }
  .rank-name{ flex:1; font-weight:700; font-size:14px; }
  .rank-team{ font-size:11px; color:var(--text-muted); }
  .rank-stars{ font-family:var(--font-display); color:var(--gold); font-size:14px; }
  .team-chip{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-inline-end:5px; }

  .settings-grid{ display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }
  @media (max-width:860px){ .settings-grid{ grid-template-columns:1fr; } }
  .field-label{ font-size:12.5px; color:var(--text-muted); margin-bottom:6px; display:block; font-weight:700; }
  .input, textarea.input{ width:100%; background:rgba(255,255,255,.04); border:1px solid var(--panel-border); color:var(--text); font-family:var(--font-body); font-size:14px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:12px; }
  textarea.input{ resize:vertical; }
  .input::placeholder{ color:var(--text-muted); }
  .swatches{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .swatch{ width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:.15s; }
  .swatch.selected{ border-color:#fff; transform:scale(1.15); }
  .team-edit-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius-md); padding:14px; margin-bottom:14px; }
  .team-edit-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .team-edit-head .team-name-wrap h4{ margin:0; font-family:var(--font-display); font-size:15px; }
  .student-chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .student-chip{ display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.05); border:1px solid var(--panel-border); border-radius:999px; padding:5px 6px 5px 10px; font-size:12.5px; }
  .student-chip button{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:14px; line-height:1; padding:2px; }
  .inline-add{ display:flex; gap:6px; }
  .inline-add input{ flex:1; margin:0; }
  .inline-add button{ flex:none; }
  .danger-zone{ margin-top:26px; padding-top:16px; border-top:1px dashed rgba(255,107,107,.3); }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:13.5px; }
  .switch{ width:46px; height:26px; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid var(--panel-border); position:relative; cursor:pointer; transition:.2s; flex:none; }
  .switch::after{ content:''; position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s; }
  .switch.on{ background:linear-gradient(135deg,var(--gold),#ffa63d); border-color:transparent; }
  .switch.on::after{ transform:translateX(-20px); }

  /* ---- Modals ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(4,6,16,.68); backdrop-filter:blur(2px); z-index:100; display:none; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }

          try{ sessionStorage.setItem('galaxy_teacher', '1'); }catch(e){}
          enterAsTeacher();
        } else {
          err.textContent = 'باسورد المعلم غلط';
          input.value = '';
          input.focus();
        }
        return;
      }

      // student — check class password from state
      btn.disabled = true;
      btn.textContent = 'بنتحقق...';
      loadState().then(function(){
        var classPass = state.class_password || DEFAULT_CLASS_PASSWORD;
        if(val === classPass){
          err.textContent = '';
          try{ sessionStorage.setItem('galaxy_student', '1'); }catch(e){}
          enterAsStudent();
        } else {
          err.textContent = 'باسورد الحصة غلط.. اسأل المعلم';
          input.value = '';
          input.focus();
        }
      }).catch(function(){
        err.textContent = 'مشكلة في الاتصال.. جرب تاني';
      }).then(function(){
        btn.disabled = false;
        btn.textContent = 'دخول 🚀';
      });
    }
    btn.addEventListener('click', tryPass);
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryPass(); });
    document.getElementById('passBackBtn').addEventListener('click', function(){
      document.getElementById('passGate').style.display = 'none';
      document.getElementById('roleGate').style.display = 'flex';
      pendingRole = null;
    });
  }

  function setupRoleGate(){
    document.getElementById('chooseTeacher').addEventListener('click', function(){
      try{
        if(sessionStorage.getItem('galaxy_teacher') === '1'){
          enterAsTeacher();
          return;
        }
      }catch(e){}
      showPassGate('teacher');
    });
    document.getElementById('chooseStudent').addEventListener('click', function(){
      try{
        if(sessionStorage.getItem('galaxy_student') === '1'){
          enterAsStudent();
          return;
        }
      }catch(e){}
      showPassGate('student');
    });
    document.getElementById('joinBack').addEventListener('click', function(){
      document.getElementById('joinView').style.display = 'none';
      document.getElementById('roleGate').style.display = 'flex';
    });
  }

  function renderJoinForm(){
    pendingJoinName = '';
    quizIndex = 0;
    quizScore = 0;
    activeQuiz = [];
    document.getElementById('joinCardBody').innerHTML =
      '<h2>انضم لفريقك 🚀</h2>' +
      '<p class="sub">اكتب اسمك، وبعدين هتحل 3 أسئلة مراجعة من الحصة اللي فاتت (كل صح = نجمة!)</p>' +
      '<input class="input" type="text" id="joinNameInput" placeholder="اكتب اسمك هنا">' +
      '<button class="btn btn-gold" id="joinSubmitBtn" style="width:100%;justify-content:center;">ابدأ الأسئلة</button>' +
      '<div id="joinMsgArea"></div>';
    document.getElementById('joinSubmitBtn').addEventListener('click', submitJoin);
    document.getElementById('joinNameInput').addEventListener('keydown', function(e){ if(e.key==='Enter') submitJoin(); });
  }

  function submitJoin(){
    var input = document.getElementById('joinNameInput');
    var name = input.value.trim();
    if(!name){ input.focus(); return; }
    var btn = document.getElementById('joinSubmitBtn');
    btn.disabled = true; btn.textContent = 'بنجهز...';
    loadState().then(function(){
      if(!state.teams.length){
        renderJoinMessage('لسه المعلم بيجهز الفرق 🙏 استنى شوية وجرب تاني.', true);
        return;
      }
      if(!state.roster_open){
        renderJoinMessage('باب الانضمام مقفول دلوقتي، اسأل المعلم يفتحه.', true);
        return;
      }
      pendingJoinName = name;
      quizIndex = 0;
      quizScore = 0;
      activeQuiz = shuffle(JOIN_QUIZ.slice()).slice(0, 3);
      renderQuizQuestion();
    });
  }

  function renderQuizQuestion(){
    if(quizIndex >= activeQuiz.length){
      finishJoinWithQuiz();
      return;
    }
    var item = activeQuiz[quizIndex];
    var optsHtml = item.options.map(function(opt, i){
      return '<button type="button" class="quiz-opt" data-opt="' + i + '">' + escapeHtml(opt) + '</button>';
    }).join('');
    document.getElementById('joinCardBody').innerHTML =
      '<div class="quiz-progress">سؤال ' + (quizIndex + 1) + ' من ' + activeQuiz.length + ' · نجومك الحالية: ' + quizScore + ' ⭐</div>' +
      '<p class="quiz-q">' + escapeHtml(item.q) + '</p>' +
      '<div class="quiz-options" id="quizOptions">' + optsHtml + '</div>';
    document.querySelectorAll('#quizOptions .quiz-opt').forEach(function(btn){
      btn.addEventListener('click', function(){ answerQuiz(parseInt(btn.dataset.opt, 10)); });
    });
  }

  function answerQuiz(chosen){
    var item = activeQuiz[quizIndex];
    var opts = document.querySelectorAll('#quizOptions .quiz-opt');
    opts.forEach(function(b){ b.disabled = true; });
    var isCorrect = chosen === item.answer;
    if(isCorrect){
      quizScore += 1;
      opts[chosen].classList.add('correct');
    } else {
      opts[chosen].classList.add('wrong');
      if(opts[item.answer]) opts[item.answer].classList.add('correct');
    }
    setTimeout(function(){ quizIndex += 1; renderQuizQuestion(); }, 900);
  }

  function finishJoinWithQuiz(){
    document.getElementById('joinCardBody').innerHTML = '<h2>بنسجلك...</h2><p class="sub">ثواني ونخلص</p>';
    loadState().then(function(){
      if(!state.teams.length || !state.roster_open){
        document.getElementById('joinCardBody').innerHTML =
          '<h2>حصل خطأ 🙏</h2><p class="sub">باب الانضمام اتقفل أو مفيش فرق. اسأل المعلم وجرب تاني.</p>' +
          '<button class="btn btn-ghost" id="joinRetryBtn">رجوع</button>';
        document.getElementById('joinRetryBtn').addEventListener('click', renderJoinForm);
        return;
      }
      var team = pickTeamForJoin();
      var student = { id: uid(), name: pendingJoinName, stars: quizScore, wrongs: 0, homeworkDone: false };
      team.students.push(student);
      return Promise.resolve(saveState()).then(function(){
        renderJoinSuccess(pendingJoinName, team, quizScore);
      });
    }).catch(function(){
      document.getElementById('joinCardBody').innerHTML =
        '<h2>مشكلة في الاتصال 🙏</h2><p class="sub">تأكد من النت وجرب تاني.</p>' +
        '<button class="btn btn-ghost" id="joinRetryBtn">رجوع</button>';
      document.getElementById('joinRetryBtn').addEventListener('click', renderJoinForm);
    });
  }

  function pickTeamForJoin(){
    var minCount = Math.min.apply(null, state.teams.map(function(t){ return t.students.length; }));
    var candidates = state.teams.filter(function(t){ return t.students.length === minCount; });
    return candidates[Math.floor(Math.random()*candidates.length)];
  }

  function renderJoinMessage(msg, isWarn){
    var btn = document.getElementById('joinSubmitBtn');
    if(btn){ btn.disabled = false; btn.textContent = 'ابدأ الأسئلة'; }
    document.getElementById('joinMsgArea').innerHTML = '<div class="join-msg' + (isWarn?' warn':'') + '">' + escapeHtml(msg) + '</div>';
  }

  function renderJoinSuccess(name, team, starsEarned){
    var starsLine = starsEarned > 0
      ? '<p class="sub" style="margin-top:10px;">كسبت <b style="color:var(--gold)">' + starsEarned + '</b> نجمة من أسئلة المراجعة ⭐</p>'
      : '<p class="sub" style="margin-top:10px;">مفيش نجوم من الأسئلة دي.. المرة الجاية تركز أكتر 💪</p>';
    document.getElementById('joinCardBody').innerHTML =
      '<h2>🎉 يا هلا يا ' + escapeHtml(name) + '!</h2>' +
      '<p class="sub">انضميت للفريق ده بنجاح</p>' +
      '<div class="team-badge-big" style="background:' + team.color + '22; color:' + team.color + '; border:1px solid ' + team.color + '55;">' +
        '<span class="dot" style="background:' + team.color + '"></span>' + escapeHtml(team.name) +
      '</div>' +
      starsLine +
      '<button class="btn btn-ghost" id="joinAnotherBtn" style="margin-top:16px;">تسجيل طالب تاني على نفس الجهاز</button>';
    document.getElementById('joinAnotherBtn').addEventListener('click', renderJoinForm);
  }

  function setupTabs(){
    document.getElementById('tabs').addEventListener('click', function(e){
      var btn = e.target.closest('.tab');
      if(!btn) return;
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      var view = document.getElementById(btn.dataset.tab);
      if(view) view.classList.add('active');
      if(btn.dataset.tab === 'leaderboard') renderLeaderboard();
      if(btn.dataset.tab === 'settings') renderSettings();

  function renderMainShell(){
    var main = document.getElementById('main');
    main.innerHTML =
      '<section id="arena" class="view active">' +
        '<div class="hint-bar">' +
          '<span>👆 اختار طالب من الفريق، بعدين دوس الإجراء من أزرار الفريق فوق</span>' +
          '<div class="actions">' +
            '<button class="btn btn-gold small" id="openCelebBtn">🏆 احتفال التوب 3</button>' +
            '<button class="btn btn-ghost small" id="openWheelBtn">🎡 العجلة / الحظ</button>' +
            '<button class="btn btn-ghost small" id="manualRefreshBtn">🔄 تحديث</button>' +
          '</div>' +
        '</div>' +
        '<div id="teamsGrid" class="teams-grid"></div>' +
      '</section>' +
      '<section id="leaderboard" class="view"><div class="lb-grid" id="lbGrid"></div></section>' +
      '<section id="settings" class="view"><div class="settings-grid" id="settingsGrid"></div></section>';

    document.getElementById('openCelebBtn').addEventListener('click', openCelebration);

    document.getElementById('manualRefreshBtn').addEventListener('click', function(){
      loadState().then(function(){ renderArena(); showToast('تحديث', 'تم تحديث البيانات ✅'); });
    });

  function teamScore(team){ return team.students.reduce(function(s, st){ return s + st.stars * 10; }, 0); }

  function renderArena(){
    var grid = document.getElementById('teamsGrid');
    if(!grid) return;
    if(!state.teams.length){
      grid.innerHTML =
        '<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🪐</div>' +
        '<h3>لسه مفيش فرق في المجرة</h3><p>روح لتاب "الإعدادات" وضيف الفرق والطلاب عشان تبدأ المعركة</p></div>';
      return;
    }
    var maxScore = Math.max.apply(null, state.teams.map(teamScore).concat([0]));
    grid.innerHTML = state.teams.map(function(team){
      var score = teamScore(team);
      var leading = state.teams.length > 1 && score === maxScore && maxScore > 0;
      var studentsHtml = team.students.length ?
        team.students.map(function(st){ return studentRowHtml(team, st); }).join('') :
        '<p class="empty-hint">أضف طلاب لهذا الفريق من الإعدادات</p>';
      return (
        '<div class="team-card' + (leading ? ' leading' : '') + '" style="--tc:' + team.color + '" data-team="' + team.id + '">' +
          '<div class="team-head">' +
            '<div class="team-name-wrap"><span class="team-swatch"></span><h3>' + escapeHtml(team.name) + (leading ? '<span class="crown">👑</span>' : '') + '</h3></div>' +
            '<div class="team-score">' + score + ' <small>نقطة</small></div>' +
          '</div>' +
          '<div class="team-actions" data-team-actions="' + team.id + '">' +
            '<button class="mini-btn btn-homework" data-team-action="homework" title="واجب +نجمتين">واجب</button>' +
            '<button class="mini-btn btn-participate" data-team-action="participate" title="نجمة مشاركة">مشاركة</button>' +
            '<button class="mini-btn btn-correct" data-team-action="correct">صح</button>' +
            '<button class="mini-btn btn-wrong" data-team-action="wrong">غلط</button>' +
            '<button class="mini-btn btn-punish" data-team-action="punish" title="خصم نجوم">عقاب</button>' +
          '</div>' +
          '<div class="students">' + studentsHtml + '</div>' +
        '</div>'
      );
    }).join('');
    restoreSelectionHighlight();
  }

  function studentRowHtml(team, st){
    var isSelected = selectedStudent && selectedStudent.studentId === st.id && selectedStudent.teamId === team.id;
    return (
      '<div class="student-row' + (isSelected ? ' selected' : '') + '" id="row-' + st.id + '" data-team="' + team.id + '" data-student="' + st.id + '">' +
        '<div class="avatar" style="background:' + team.color + '26;color:' + team.color + '">' + escapeHtml(initials(st.name)) + '</div>' +
        '<div class="student-info"><span class="student-name">' + escapeHtml(st.name) + '</span></div>' +
        '<div class="star-count" id="tray-' + st.id + '">⭐ ' + (st.stars || 0) + '</div>' +
      '</div>'
    );
  }

  function restoreSelectionHighlight(){
    if(!selectedStudent) return;
    var row = document.getElementById('row-' + selectedStudent.studentId);
    if(row) row.classList.add('selected');
  }

  function setSelectedStudent(teamId, studentId){
    selectedStudent = { teamId: teamId, studentId: studentId };
    document.querySelectorAll('.student-row.selected').forEach(function(r){ r.classList.remove('selected'); });
    var row = document.getElementById('row-' + studentId);
    if(row) row.classList.add('selected');
  }

  function updateStarCountDom(studentId, stars){
    var el = document.getElementById('tray-' + studentId);
    if(!el) return;
    el.textContent = '⭐ ' + stars;
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }

  function findTeam(teamId){ return state.teams.find(function(t){ return t.id === teamId; }); }
  function findStudent(teamId, studentId){
    var team = findTeam(teamId);
    if(!team) return null;
    return team.students.find(function(s){ return s.id === studentId; }) || null;
  }

  function updateTeamScoreDom(teamId){
    var team = findTeam(teamId);
    var el = document.querySelector('.team-card[data-team="' + teamId + '"] .team-score');
    if(el) el.innerHTML = teamScore(team) + ' <small>نقطة</small>';
  }
  function updateLeadingCrown(){
    var maxScore = Math.max.apply(null, state.teams.map(teamScore).concat([0]));
    document.querySelectorAll('.team-card').forEach(function(card){
      var id = card.dataset.team, team = findTeam(id), score = teamScore(team);
      var isLeading = state.teams.length > 1 && score === maxScore && maxScore > 0;
      var h3 = card.querySelector('.team-head h3');
      var hasCrown = h3.querySelector('.crown');
      card.classList.toggle('leading', isLeading);
      if(isLeading && !hasCrown){ var span=document.createElement('span'); span.className='crown'; span.textContent='👑'; h3.appendChild(span); }
      else if(!isLeading && hasCrown){ hasCrown.remove(); }
    });
  }

  function showToast(title, message){
    var wrap = document.getElementById('toast-container');
    var el = document.createElement('div'); el.className = 'toast';
    el.innerHTML = '<b>' + escapeHtml(title) + '</b>' + escapeHtml(message);
    wrap.appendChild(el);
    setTimeout(function(){ el.classList.add('leaving'); setTimeout(function(){ el.remove(); }, 260); }, 3800);
  }

  function setupArenaEvents(){
    document.getElementById('main').addEventListener('click', function(e){
      var row = e.target.closest('.student-row');
      if(row && !e.target.closest('[data-team-action]')){
        setSelectedStudent(row.dataset.team, row.dataset.student);
        return;
      }
      var btn = e.target.closest('[data-team-action]');
      if(!btn) return;
      var teamId = btn.closest('[data-team-actions]').dataset.teamActions;
      if(!selectedStudent || selectedStudent.teamId !== teamId){
        showToast('اختار طالب', 'دوس على اسم طالب من نفس الفريق الأول');
        return;
      }
      var action = btn.dataset.teamAction;
      var studentId = selectedStudent.studentId;
      if(action === 'participate'){ giveParticipationStar(teamId, studentId); return; }
      if(action === 'homework'){ giveHomeworkStars(teamId, studentId); return; }
      if(action === 'punish'){ openPunishPicker(teamId, studentId); return; }
      openCardDraw(action, teamId, studentId);
    });
  }

  function openPunishPicker(teamId, studentId){
    var student = findStudent(teamId, studentId);
    if(!student) return;
    var current = student.stars || 0;
    var overlay = document.getElementById('cardModalOverlay');
    overlay.innerHTML =
      '<div class="modal-box" style="text-align:center;">' +
        '<h3>⚠️ عقاب: ' + escapeHtml(student.name) + '</h3>' +
        '<p style="margin-bottom:6px;">نجوم حالياً: <b style="color:var(--gold)">' + current + '</b> ⭐</p>' +
        '<p style="margin-bottom:14px;">اختار هتخصم كام نجمة</p>' +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;">' +
          '<button class="btn btn-danger-outline" data-deduct="1">−1 ⭐</button>' +
          '<button class="btn btn-danger-outline" data-deduct="2">−2 ⭐</button>' +
          '<button class="btn btn-danger-outline" data-deduct="3">−3 ⭐</button>' +
        '</div>' +
        '<button class="btn btn-ghost" id="punishCancelBtn">إلغاء</button>' +
      '</div>';
    overlay.classList.add('open');
    overlay.querySelectorAll('[data-deduct]').forEach(function(b){
      b.addEventListener('click', function(){
        applyStarDeduction(teamId, studentId, parseInt(b.dataset.deduct, 10));
        overlay.classList.remove('open');
      });
    });
    document.getElementById('punishCancelBtn').onclick = function(){ overlay.classList.remove('open'); };
  }

  function applyStarDeduction(teamId, studentId, amount){
    var st = findStudent(teamId, studentId);
    if(!st) return;
    var before = st.stars || 0;
    var removed = Math.min(amount, before);
    st.stars = Math.max(0, before - amount);
    st.wrongs = (st.wrongs || 0) + 1;
    saveState();
    updateStarCountDom(studentId, st.stars);
    updateTeamScoreDom(teamId);
    updateLeadingCrown();
    var row = document.getElementById('row-' + studentId);
    if(row){
      row.classList.add('shake');
      row.addEventListener('animationend', function(){ row.classList.remove('shake'); }, { once:true });
    }
    showToast('عقاب ⚠️', escapeHtml(st.name) + ' اتخصم منه ' + removed + ' نجمة');
  }

  function giveParticipationStar(teamId, studentId){
    var st = findStudent(teamId, studentId);
    if(!st) return;
    st.stars = (st.stars || 0) + 1;
    saveState();
    updateStarCountDom(studentId, st.stars);
    updateTeamScoreDom(teamId);
    updateLeadingCrown();
    showToast('مشاركة ⭐', escapeHtml(st.name) + ' خد نجمة مشاركة!');
  }

  function giveHomeworkStars(teamId, studentId){
    var st = findStudent(teamId, studentId);
    if(!st) return;
    if(st.homeworkDone){
      showToast('تنبيه', escapeHtml(st.name) + ' خد نجوم الواجب قبل كده');
      return;
    }
    st.stars = (st.stars || 0) + 2;
    st.homeworkDone = true;
    saveState();
    updateStarCountDom(studentId, st.stars);
    updateTeamScoreDom(teamId);
    updateLeadingCrown();
    showToast('واجب ✅', escapeHtml(st.name) + ' خد نجمتين على الواجب!');
  }

  function openCardDraw(mode, teamId, studentId){
    var student = findStudent(teamId, studentId);
    if(!student) return;
    var deck = mode === 'correct' ? REWARD_DECK : PUNISH_DECK;
    var picks = pickN(deck, 3);
    var title, subtitle;
    if(mode === 'correct'){
      title = '🎉 كارت الجايزة لـ ' + escapeHtml(student.name);
      subtitle = 'اختار كارت واحد وشوف هيكسب كام نجمة';
    } else if(mode === 'punish'){
      title = '⚠️ كارت العقاب لـ ' + escapeHtml(student.name);
      subtitle = 'بيتكلم أو سلوك غلط؟ اختار كارت العقاب';
    } else {
      title = '😬 كارت التحدي لـ ' + escapeHtml(student.name);
      subtitle = 'اختار كارت واحد وشوف التحدي';
    }
    var overlay = document.getElementById('cardModalOverlay');
    overlay.innerHTML =
      '<div class="modal-box card-modal-box">' +
        '<h3>' + title + '</h3>' +
        '<p>' + subtitle + '</p>' +
        '<div class="card-row" id="cardRow">' + picks.map(function(_, i){ return '<button class="game-card" data-i="' + i + '"><div class="card-inner">' +
          '<div class="card-face card-front-face">✦</div><div class="card-face card-back-face"></div></div></button>'; }).join('') + '</div>' +
        '<div id="cardResultActions" style="display:none; margin-top:14px;"><button class="btn btn-gold" id="cardDoneBtn">تمام، كمل</button></div>' +
      '</div>';
    overlay.classList.add('open');
    overlay.dataset.chosen = '';

    overlay.querySelectorAll('.game-card').forEach(function(cardEl){
      cardEl.addEventListener('click', function(){
        if(overlay.dataset.chosen) return;
        overlay.dataset.chosen = '1';
        var idx = parseInt(cardEl.dataset.i, 10);
        var card = picks[idx];
        overlay.querySelectorAll('.game-card').forEach(function(c){ if(c !== cardEl) c.classList.add('not-chosen'); });
        cardEl.classList.add('flipped');
        var backFace = cardEl.querySelector('.card-back-face');
        backFace.innerHTML = '<div class="card-icon">' + card.icon + '</div><div class="card-text">' + escapeHtml(card.text) + '</div>' +
          (card.stars ? '<div class="card-stars">' + (card.stars > 0 ? '+' : '') + card.stars + ' ⭐</div>' : '');
        setTimeout(function(){
          applyCardEffect(mode, teamId, studentId, card);
          document.getElementById('cardResultActions').style.display = 'block';
        }, 650);
      });
    });

    setTimeout(function(){
      var doneBtnCheck = document.getElementById('cardDoneBtn');
      if(doneBtnCheck) doneBtnCheck.addEventListener('click', function(){ overlay.classList.remove('open'); });
    }, 0);
  }

  function applyCardEffect(mode, teamId, studentId, card){
    var st = findStudent(teamId, studentId);
    if(!st) return;
    st.stars = Math.max(0, st.stars + (card.stars || 0));
    if(mode === 'wrong' || mode === 'punish') st.wrongs = (st.wrongs || 0) + 1;
    saveState();
    updateStarCountDom(studentId, st.stars);
    updateTeamScoreDom(teamId);
    updateLeadingCrown();
    if(mode === 'wrong' || mode === 'punish'){
      var row = document.getElementById('row-' + studentId);
      if(row){ row.classList.add('shake'); row.addEventListener('animationend', function(){ row.classList.remove('shake'); }, { once:true }); }
    }
  }

  function setWheelMode(mode){
    wheelMode = mode;
    var pickBtn = document.getElementById('wheelModePick');
    var luckBtn = document.getElementById('wheelModeLuck');
    if(mode === 'pick'){
      pickBtn.style.borderColor = 'var(--gold)';
      pickBtn.style.background = 'rgba(255,197,61,.15)';
      luckBtn.style.borderColor = '';
      luckBtn.style.background = '';
      document.getElementById('wheelModalTitle').textContent = '🎡 اختيار طالب';
      document.getElementById('wheelModeHint').textContent = 'مين هيجاوب دلوقتي؟';
      document.getElementById('wheelPickControls').style.display = 'block';
      document.getElementById('wheelLuckControls').style.display = 'none';
    } else {

  function buildWheel(){
    var dial = document.getElementById('wheelDial');
    var labels = document.getElementById('wheelLabels');
    document.getElementById('wheelResult').textContent = '';

    if(wheelMode === 'luck'){
      var n = LUCK_OUTCOMES.length, slice = 360 / n;
      var gradient = LUCK_OUTCOMES.map(function(o, i){
        return o.color + ' ' + (i * slice) + 'deg ' + ((i + 1) * slice) + 'deg';
      }).join(', ');
      dial.style.background = 'conic-gradient(from 0deg, ' + gradient + ')';
      labels.innerHTML = LUCK_OUTCOMES.map(function(o, i){
        var mid = i * slice + slice / 2;
        return '<div class="wheel-label" style="transform:rotate(' + mid + 'deg);"><span style="transform:rotate(' + (-mid) + 'deg);font-size:10px;">' + o.label + '</span></div>';
      }).join('');
      var hasStudents = state.teams.some(function(t){ return t.students.length; });
      document.getElementById('spinBtn').disabled = !hasStudents;
      return;
    }

    // pick mode
    var select = document.getElementById('wheelTeamSelect');
    var teamId = select ? select.value : 'all';
    wheelStudents = [];
    state.teams.forEach(function(team){
      if(teamId !== 'all' && team.id !== teamId) return;
      team.students.forEach(function(st){ wheelStudents.push({ id: st.id, name: st.name, teamId: team.id, teamName: team.name, color: team.color }); });
    });
    if(wheelStudents.length < 2){
      dial.style.background = 'rgba(255,255,255,.06)';
      labels.innerHTML = '<div class="wheel-label" style="padding-top:110px;"><span>محتاج طالبين على الأقل</span></div>';
      document.getElementById('spinBtn').disabled = true;
      return;
    }
    document.getElementById('spinBtn').disabled = false;
    var n = wheelStudents.length, slice = 360 / n;
    var colors = wheelStudents.map(function(s){ return s.color; });
    var gradient = colors.map(function(c, i){
      return c + ' ' + (i * slice) + 'deg ' + ((i + 1) * slice) + 'deg';
    }).join(', ');
    dial.style.background = 'conic-gradient(from 0deg, ' + gradient + ')';
    labels.innerHTML = wheelStudents.map(function(s, i){
      var mid = i * slice + slice / 2;
      return '<div class="wheel-label" style="transform:rotate(' + mid + 'deg);"><span style="transform:rotate(' + (-mid) + 'deg)">' + escapeHtml(s.name) + '</span></div>';
    }).join('');
  }

  function spinWheel(){
    if(wheelSpinning) return;

    if(wheelMode === 'luck'){
      spinLuckWheel();
      return;
    }

    if(wheelStudents.length < 2) return;
    wheelSpinning = true;
    document.getElementById('spinBtn').disabled = true;
    var n = wheelStudents.length, slice = 360 / n;
    var winnerIndex = Math.floor(Math.random() * n);
    var winnerMid = winnerIndex * slice + slice / 2;
    var spins = 6;
    var base = wheelRotation - (wheelRotation % 360);
    var target = base + spins * 360 + (360 - winnerMid);
    wheelRotation = target;
    var spinner = document.getElementById('wheelSpinner');
    spinner.style.transition = 'transform 4.2s cubic-bezier(.15,.7,.1,1)';
    spinner.style.transform = 'rotate(' + target + 'deg)';
    setTimeout(function(){
      var winner = wheelStudents[winnerIndex];
      document.getElementById('wheelResult').innerHTML = '🎉 هيجاوب: <span style="color:' + winner.color + '">' + escapeHtml(winner.name) + '</span> (' + escapeHtml(winner.teamName) + ')';
      setSelectedStudent(winner.teamId, winner.id);
      wheelSpinning = false;
      document.getElementById('spinBtn').disabled = false;
    }, 4300);
  }

  function spinLuckWheel(){
    var sel = document.getElementById('wheelLuckStudent');
    var val = sel ? sel.value : '';
    if(!val || val.indexOf('|') === -1){
      showToast('اختار طالب', 'اختار طالب من القائمة الأول');
      return;
    }
    var parts = val.split('|');
    var teamId = parts[0];
    var studentId = parts[1];
    var st = findStudent(teamId, studentId);
    if(!st){
      showToast('خطأ', 'الطالب مش موجود');
      return;
    }

    wheelSpinning = true;
    document.getElementById('spinBtn').disabled = true;
    var n = LUCK_OUTCOMES.length, slice = 360 / n;
    var winnerIndex = Math.floor(Math.random() * n);
    var winnerMid = winnerIndex * slice + slice / 2;
    var spins = 6;
    var base = wheelRotation - (wheelRotation % 360);
    var target = base + spins * 360 + (360 - winnerMid);
    wheelRotation = target;
    var spinner = document.getElementById('wheelSpinner');
    spinner.style.transition = 'transform 4.2s cubic-bezier(.15,.7,.1,1)';
    spinner.style.transform = 'rotate(' + target + 'deg)';

    setTimeout(function(){
      var outcome = LUCK_OUTCOMES[winnerIndex];
      var before = st.stars || 0;
      st.stars = Math.max(0, before + outcome.stars);
      if(outcome.kind === 'bad') st.wrongs = (st.wrongs || 0) + 1;
      saveState();
      updateStarCountDom(studentId, st.stars);
      updateTeamScoreDom(teamId);
      updateLeadingCrown();
      setSelectedStudent(teamId, studentId);

      var starsText = outcome.stars > 0 ? ('+' + outcome.stars + ' ⭐') : (outcome.stars < 0 ? (outcome.stars + ' ⭐') : 'بدون تغيير');
      document.getElementById('wheelResult').innerHTML =
        '<span style="color:' + outcome.color + '">' + outcome.label + '</span><br>' +
        '<b>' + escapeHtml(st.name) + '</b> → ' + starsText +
        ' (صار عنده ' + st.stars + ' ⭐)';

      if(outcome.kind === 'bad'){
        var row = document.getElementById('row-' + studentId);
        if(row){
          row.classList.add('shake');
          row.addEventListener('animationend', function(){ row.classList.remove('shake'); }, { once:true });
        }
      }
      showToast(outcome.label, escapeHtml(st.name) + ' ' + starsText);
      wheelSpinning = false;
      document.getElementById('spinBtn').disabled = false;
    }, 4300);
  }

  function setupSettingsEvents(){
    var main = document.getElementById('main');
    main.addEventListener('click', function(e){
      var sw = e.target.closest('.swatch');
      if(sw){
        selectedColor = sw.dataset.color;
        document.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('selected'); });
        sw.classList.add('selected');
        return;
      }
      if(e.target.id === 'addTeamBtn'){
        var nameInput = document.getElementById('newTeamName');
        var name = nameInput.value.trim();
        if(!name){ nameInput.focus(); return; }
        state.teams.push({ id: uid(), name: name, color: selectedColor, students: [] });
        selectedColor = TEAM_COLORS[state.teams.length % TEAM_COLORS.length];
        saveState(); renderSettings(); renderArena();
        return;
      }
      var rmTeam = e.target.closest('[data-remove-team]');
      if(rmTeam){
        var teamId = rmTeam.dataset.removeTeam, team = findTeam(teamId);
        openConfirm('حذف "' + (team ? team.name : 'الفريق') + '"؟', 'هيتم حذف الفريق وكل نجوم طلابه، الخطوة دي مش قابلة للتراجع.', function(){
          state.teams = state.teams.filter(function(t){ return t.id !== teamId; });
          saveState(); renderSettings(); renderArena();
        });
        return;
      }
      var rmStudent = e.target.closest('[data-remove-student]');
      if(rmStudent){
        var tId = rmStudent.dataset.team, sId = rmStudent.dataset.removeStudent, t = findTeam(tId);
        if(t){ t.students = t.students.filter(function(s){ return s.id !== sId; }); saveState(); renderSettings(); renderArena(); }
        return;
      }
      var addStudentBtn = e.target.closest('[data-add-student]');
      if(addStudentBtn){
        var teamId2 = addStudentBtn.dataset.addStudent;
        var input = document.querySelector('[data-student-input="' + teamId2 + '"]');
        var name2 = input.value.trim();
        if(!name2){ input.focus(); return; }
        findTeam(teamId2).students.push({ id: uid(), name: name2, stars: 0, wrongs: 0 });
        saveState(); renderSettings(); renderArena();
        return;
      }
      if(e.target.id === 'quickSplitBtn'){
        var namesRaw = document.getElementById('bulkNames').value;
        var names = namesRaw.split('\n').map(function(n){ return n.trim(); }).filter(Boolean);
        var count = Math.max(2, Math.min(8, parseInt(document.getElementById('bulkTeamCount').value, 10) || 4));
        if(!names.length){ document.getElementById('bulkNames').focus(); return; }
        openConfirm('تقسيم تلقائي؟', 'هيتم استبدال كل الفرق الحالية بتوزيع جديد لـ ' + names.length + ' طالب على ' + count + ' فرق.', function(){
          quickSplit(names, count);
          renderSettings(); renderArena();
        });
        return;
      }
      if(e.target.id === 'rosterToggle'){
        state.roster_open = !state.roster_open;
        saveState(); renderSettings();
        return;
      }
      if(e.target.id === 'saveClassPassBtn'){
        var passInput = document.getElementById('classPassInput');
        var newPass = passInput.value.trim();
        if(!newPass){
          showToast('تنبيه', 'الباسورد مينفعش يكون فاضي');
          passInput.focus();
          return;
        }
        state.class_password = newPass;
        saveState();
        showToast('تم ✅', 'باسورد الحصة اتغير لـ: ' + newPass);
        renderSettings();
        return;
      }
      if(e.target.id === 'resetAllBtn'){
        openConfirm('مسح كل البيانات؟', 'هيتم حذف كل الفرق والطلاب والنجوم نهائيًا. باسورد الحصة هيرجع للافتراضي.', function(){
          state = { teams: [], roster_open: false, class_password: DEFAULT_CLASS_PASSWORD };
          saveState(); renderSettings(); renderArena();
        });
        return;
      }
    });

    main.addEventListener('keydown', function(e){
      if(e.key !== 'Enter') return;
      if(e.target.id === 'newTeamName') document.getElementById('addTeamBtn').click();
      if(e.target.hasAttribute('data-student-input')){
        document.querySelector('[data-add-student="' + e.target.getAttribute('data-student-input') + '"]').click();
      }
    });
  }

  function quickSplit(names, teamCount){
    var shuffled = shuffle(names.slice());
    var newTeams = [];
    for(var i=0;i<teamCount;i++){
      var label = TEAM_NAME_POOL[i % TEAM_NAME_POOL.length] + (i >= TEAM_NAME_POOL.length ? ' ' + (i+1) : '');
      newTeams.push({ id: uid(), name: label, color: TEAM_COLORS[i % TEAM_COLORS.length], students: [] });
    }
    shuffled.forEach(function(name, idx){
      newTeams[idx % teamCount].students.push({ id: uid(), name: name, stars: 0, wrongs: 0 });
    });
    state.teams = newTeams;
    saveState();
  }

  var confirmCallback = null;
  function openConfirm(title, text, cb){
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalText').textContent = text;
    confirmCallback = cb;
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeConfirm(){ document.getElementById('modalOverlay').classList.remove('open'); confirmCallback = null; }
  function setupModal(){
    document.getElementById('modalCancel').addEventListener('click', closeConfirm);
    document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id === 'modalOverlay') closeConfirm(); });
    document.getElementById('modalConfirm').addEventListener('click', function(){ if(confirmCallback) confirmCallback(); closeConfirm(); });
  }

  function startPolling(){
    stopPolling();
    if(storageMode === 'firebase'){
      startRealtimeSync();
      return;
    }
    pollTimer = setInterval(function(){
      if(document.hidden) return;
      if(document.getElementById('cardModalOverlay').classList.contains('open')) return;
      loadState().then(function(){
        var activeTab = document.querySelector('.tab.active');
        if(!activeTab) return;
        if(activeTab.dataset.tab === 'arena') renderArena();
        if(activeTab.dataset.tab === 'leaderboard') renderLeaderboard();
      });
    }, 6000);
  }
  function stopPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = null;
    stopRealtimeSync();
  }

  function init(){
    try{
      var fbOk = false;
      try{ fbOk = initFirebase(); }catch(e){ console.error('Firebase init error', e); fbOk = false; }
      if(!fbOk) storageMode = detectLocalStorage();
      buildStarfield();
      setupPasswordGate();
      setupRoleGate();
      setupTabs();
      setupModal();
      var sub = document.querySelector('#roleGate .sub');
      if(sub){
        if(fbOk){
          sub.innerHTML = '✅ متصل بـ Firebase — البيانات مشتركة بين كل الأجهزة';
          sub.style.color = 'var(--success)';
        } else {
          sub.innerHTML = '⚠️ Firebase مش متصل — البيانات مش هتتزامن بين الأجهزة.<br><span style="font-size:12px">تأكد من config و Realtime Database و Rules</span>';
          sub.style.color = 'var(--danger)';
        }
      }
    }catch(e){
      console.error('Init failed', e);
      alert('حصل خطأ في تحميل الصفحة: ' + (e && e.message ? e.message : e));
    }
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
